              '天然气':'CNG','液化气':'LPG','混合燃料':'Flex Fuel','氢':'Hydrogen',
              '天窗':'Sunroof','真皮':'Leather','导航':'Navigation',
              '倒车':'Reverse','雷达':'Radar','影像':'Camera',
              '全景':'Panoramic','巡航':'Cruise','自适应':'Adaptive',
              '车道':'Lane','偏离':'Departure','预警':'Warning',
              '自动泊车':'Auto Park','自动空调':'Auto AC','座椅加热':'Seat Heating',
              '座椅通风':'Seat Ventilation','座椅按摩':'Seat Massage','氛围灯':'Ambient Light',
              '无钥匙':'Keyless','一键启动':'Push Start','电动尾门':'Power Tailgate',
              '感应雨刷':'Rain Sensor','自动大灯':'Auto Headlights','日行灯':'DRL',
              'LED大灯':'LED Headlights','激光大灯':'Laser Headlights','矩阵大灯':'Matrix Headlights',
              '抬头显示':'HUD','全液晶仪表':'Digital Cluster','中控大屏':'Central Screen',
              '无线充电':'Wireless Charging','车载WiFi':'Car WiFi','OTA升级':'OTA Updates',
              '城市':'City','乡村':'Country','高速':'Highway',
              '自动挡':'Automatic','手动挡':'Manual','手自一体':'Tiptronic',
              '新车':'New Car','二手车':'Used Car','试驾车':'Test Drive Car',
              '展车':'Display Car','库存车':'Inventory Car','定制车':'Custom Car',
              '进口':'Imported','国产':'Domestic','合资':'Joint Venture',
              '豪华':'Luxury','运动':'Sport','旗舰':'Flagship','标准':'Standard',
              '加长':'LWB','短轴':'SWB','高性能':'High Performance'
            };
            
            // ============================================================
            // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (ПОЛНОСТЬЮ ИЗ ВАШЕГО КОДА)
            // ============================================================
            
            function translate(text) {
              if (!text) return text || '';
              let result = String(text);
              for (let [key, value] of Object.entries(TRANSLATIONS)) {
                result = result.replace(new RegExp(key, 'g'), value);
              }
              result = result.replace(/[\\u4e00-\\u9fff]/g, ' ');
              result = result.replace(/\\s+/g, ' ').trim();
              result = result.replace(/Dark Blue/g, 'Deepal');
              result = result.replace(/M\\s*Performance/g, '');
              return result || text;
            }
            
            function getModel(car) {
              let brand = translate(car.brandname || '');
              let series = translate(car.seriesname || '');
              let carname = translate(car.carname || '');
              let modelName = '';
              if (series && series.length > 0 && series !== 'Без названия') {
                modelName = series.replace(/\\d{4}/g, '').replace(/款/g, '').replace(/г\\./g, '').replace(/год/g, '').replace(/\\s+/g, ' ').trim();
              } else if (carname && carname.length > 0 && carname !== 'Без названия') {
                modelName = carname.replace(/\\d{4}/g, '').replace(/款/g, '').replace(/г\\./g, '').replace(/год/g, '').replace(/\\s+/g, ' ').trim();
              }
              if (brand && modelName.toLowerCase().startsWith(brand.toLowerCase())) {
                modelName = modelName.substring(brand.length).trim();
              }
              if (brand && modelName && modelName.length > 0) {
                return brand + ' ' + modelName;
              }
              if (brand) return brand;
              if (modelName && modelName.length > 0) return modelName;
              return 'Без названия';
            }
            
            function getFullTitle(car) {
              let brand = translate(car.brandname || '');
              let series = translate(car.seriesname || '');
              let carname = translate(car.carname || '');
              let year = cleanYear(car.firstregyear || '');
              let modelName = '';
              if (series && series.length > 0 && series !== 'Без названия') {
                modelName = series.replace(/\\d{4}/g, '').replace(/款/g, '').replace(/г\\./g, '').replace(/год/g, '').replace(/\\s+/g, ' ').trim();
              } else if (carname && carname.length > 0 && carname !== 'Без названия') {
                modelName = carname.replace(/\\d{4}/g, '').replace(/款/g, '').replace(/г\\./g, '').replace(/год/g, '').replace(/\\s+/g, ' ').trim();
              }
              if (brand && modelName.toLowerCase().startsWith(brand.toLowerCase())) {
                modelName = modelName.substring(brand.length).trim();
              }
              let parts = [];
              if (brand) parts.push(brand);
              if (modelName && modelName.length > 0) parts.push(modelName);
              if (year) parts.push(year);
              return parts.length > 0 ? parts.join(' ') : (brand || 'Без названия');
            }
            
            function cleanYear(value) {
              if (!value) return '';
              let y = String(value).replace(/[^0-9]/g, '');
              if (y.length === 2) y = '20' + y;
              if (y.length === 1) y = '200' + y;
              if (y.length > 4) y = y.substring(0, 4);
              return y;
            }
            
            function fixImageUrl(url) {
              if (!url) return '';
              let s = String(url).trim();
              if (s.startsWith('//')) s = 'https:' + s;
              if (s.startsWith('/')) s = 'https://2sc2.autoimg.cn' + s;
              if (s.includes('autoimg.cn') || s.includes('alicdn') || s.includes('aliyuncs')) {
                return 'https://images.weserv.nl/?url=' + encodeURIComponent(s) + '&w=800&output=webp&we=1';
              }
              return s;
            }
            
            function getImages(car) {
              let imgs = [];
              if (car.imageurl) {
                let img = fixImageUrl(car.imageurl);
                if (img) imgs.push(img);
              }
              if (car.piclist) {
                for (let p of car.piclist) {
                  let img = fixImageUrl(p);
                  if (img && !imgs.includes(img)) imgs.push(img);
                }
              }
              if (!imgs.length) {
                imgs.push('https://via.placeholder.com/400x300/EAEAEA/AAAAAA?text=Фото+нет');
              }
              return imgs;
            }
            
            function calcPrice(price, rate) {
              if (!price || price <= 0) return 0;
              return Math.round((price * 10000 + 25000) * rate / 100) * 100;
            }
            
            function getEngineType(car) {
              let all = [car.engine || '', car.fuelname || '', car.fuelType || '', car.powerType || '', car.energyType || ''].join(' ').toLowerCase();
              if (['纯电动', '纯电', '电动', 'электро', 'electric', 'ev', 'bev', '新能源', 'new energy', 'электромобиль'].some(k => all.includes(k))) {
                if (['бензин', 'дизель', '汽油', '柴油'].some(k => all.includes(k))) return 'ice';
                return 'electric';
              }
              if (['增程式', '插电式', 'гибрид', '油电', 'hybrid', 'phev', 'erev', '混合动力', '混动'].some(k => all.includes(k))) return 'hybrid';
              if (car.isNewEnergy === 1 || car.newEnergy === 1) {
                if (['бензин', 'дизель', '汽油', '柴油'].some(k => all.includes(k))) return 'ice';
                return 'electric';
              }
              return 'ice';
            }
            
            function extractPower(str) {
              if (!str) return '';
              let s = String(str);
              let m = s.match(/(\\d+)\\s*马力/);
              if (m) return parseInt(m[1]) + ' HP';
              m = s.match(/(\\d+)\\s*千瓦/);
              if (m) return parseInt(m[1]) + ' kW';
              m = s.match(/(\\d+)\\s*(HP|kW|кВт|лс)/i);
              if (m) return m[1] + ' ' + m[2].toUpperCase();
              return '';
            }
            
            function getTransmissionType(gear) {
              if (!gear) return 'unknown';
              let s = String(gear).toLowerCase();
              if (s.includes('手动') || s.includes('manual')) return 'Manual';
              if (s.includes('自动') || s.includes('automatic')) {
                if (s.includes('cvt') || s.includes('无级变速')) return 'CVT';
                if (s.includes('dct') || s.includes('双离合')) return 'DCT';
                if (s.includes('手自一体')) return 'Tiptronic';
                return 'Automatic';
              }
              return 'Automatic';
            }
            
            function getDriveType(drive) {
              if (!drive) return 'unknown';
              let s = String(drive).toLowerCase();
              if (s.includes('四驱') || s.includes('awd')) return 'AWD';
              if (s.includes('后驱') || s.includes('rwd')) return 'RWD';
              if (s.includes('前驱') || s.includes('fwd')) return 'FWD';
              return 'unknown';
            }
            
            function getBodyType(level) {
              if (!level) return 'unknown';
              let s = String(level).toLowerCase();
              if (s.includes('suv')) return 'SUV';
              if (s.includes('sedan') || s.includes('轿车')) return 'Sedan';
              if (s.includes('mpv')) return 'MPV';
              if (s.includes('hatchback') || s.includes('掀背')) return 'Hatchback';
              if (s.includes('wagon') || s.includes('旅行')) return 'Wagon';
              if (s.includes('pickup') || s.includes('皮卡')) return 'Pickup';
              if (s.includes('sports') || s.includes('跑车')) return 'Sports Car';
              if (s.includes('convertible') || s.includes('敞篷')) return 'Convertible';
              if (s.includes('coupe') || s.includes('双门')) return 'Coupe';
              return 'SUV';
            }
            
            // ============================================================
            // ОСНОВНАЯ ФУНКЦИЯ ЗАГРУЗКИ
            // ============================================================
            
            async function loadAllData() {
              console.log('🔄 Загрузка данных из', SOURCES.length, 'источников...');
              let allCars = [];
              let errors = [];
              let currencyRate = 0.42753;
              
              // Получаем курс
              try {
                const rateResponse = await fetch('https://api.nbrb.by/exrates/rates/CNY?parammode=2');
                if (rateResponse.ok) {
                  const rateData = await rateResponse.json();
                  if (rateData.Cur_OfficialRate > 0) {
                    currencyRate = rateData.Cur_OfficialRate / 10;
                    console.log('💰 Курс CNY:', currencyRate);
                  }
                }
              } catch (e) {
                console.warn('⚠️ Ошибка получения курса, используем значение по умолчанию');
              }
              
              for (const source of SOURCES) {
                try {
                  console.log('📥 Загрузка:', source.name);
                  const response = await fetch(source.url);
                  
                  if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                  }
                  
                  const data = await response.json();
                  
                  if (!Array.isArray(data)) {
                    throw new Error('Ответ не является массивом');
                  }
                  
                  if (data.length === 0) {
                    console.warn('⚠️', source.name, 'вернул пустой массив');
                    continue;
                  }
                  
                  // Обрабатываем каждый автомобиль
                  const processed = data.map(car => {
                    const brand = translate(car.brandname || '');
                    const series = translate(car.seriesname || '');
                    const model = getModel(car);
                    const fullTitle = getFullTitle(car);
                    const engineType = getEngineType(car);
                    const mileage = car.mileage ? Math.round(parseFloat(car.mileage) * 10000) : null;
                    const isNew = mileage !== null && mileage <= 1000;
                    const year = cleanYear(car.firstregyear || '');
                    
                    return {
                      id: car.id || car.infoid || Math.random().toString(36).substr(2, 9),
                      infoid: car.infoid || car.id || Math.random().toString(36).substr(2, 9),
                      brand: brand,
                      series: series,
                      model: model,
                      full_title: fullTitle,
                      year: year,
                      engine: translate(car.engine || ''),
                      engine_type: engineType,
                      displacement: car.displacement ? car.displacement + 'L' : '',
                      power: extractPower(car.engine || ''),
                      fuel_type: engineType === 'electric' ? 'Electric' : engineType === 'hybrid' ? 'Hybrid' : 'Gasoline',
                      transmission: getTransmissionType(car.gearbox || ''),
                      transmission_detail: translate(car.gearbox || ''),
                      drive: getDriveType(car.drivingmode || ''),
                      drive_detail: translate(car.drivingmode || ''),
                      body_type: getBodyType(car.levelname || ''),
                      body_detail: translate(car.levelname || ''),
                      color: translate(car.colorname || ''),
                      mileage: mileage,
                      is_new: isNew,
                      price_cny: car.price || 0,
                      price_byn: calcPrice(car.price || 0, currencyRate),
                      images: getImages(car),
                      image_main: car.imageurl ? fixImageUrl(car.imageurl) : '',
                      city: translate(car.cname || car.city || ''),
                      province: translate(car.provincename || ''),
                      vin: car.vincode || '',
                      description: translate(car.remark || ''),
                      views: car.followcount || 0,
                      is_new_energy: car.isNewEnergy === 1 || car.newEnergy === 1
                    };
                  });
                  
                  allCars.push(...processed);
                  console.log('✅', source.name, 'загружено:', processed.length);
                  
                } catch (error) {
                  console.error('❌ Ошибка', source.name, ':', error.message);
                  errors.push(source.name + ': ' + error.message);
                }
              }
              
              console.log('📊 Всего загружено:', allCars.length);
              if (errors.length) {
                console.warn('⚠️ Ошибки:', errors);
              }
              
              return {
                success: true,
                count: allCars.length,
                timestamp: new Date().toISOString(),
                cars: allCars,
                errors: errors
              };
            }
            
            // ============================================================
            // ЗАПУСК
            // ============================================================
            
            loadAllData()
              .then(data => {
                const json = JSON.stringify(data, null, 2);
                fs.writeFileSync('catalog.json', json);
                console.log('💾 Файл catalog.json сохранен!');
                console.log('📊 Всего машин:', data.count);
                if (data.errors && data.errors.length) {
                  console.warn('⚠️ Ошибок:', data.errors.length);
                }
                process.exit(0);
              })
              .catch(error => {
                console.error('❌ Критическая ошибка:', error);
                process.exit(1);
              });
          "
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --staged --quiet || git commit -m "Update catalog data [skip ci]"
          git push
